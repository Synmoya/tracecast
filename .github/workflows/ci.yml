name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,console]"
      - name: Compile
        run: python -m compileall -q src tests
      - name: Test
        run: python -m pytest -q
      - name: Public boundary and distributions
        run: python tools/check_publication.py
      - name: Lint
        run: ruff check .
      - name: Whitespace
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
          elif [[ -n "$BEFORE_SHA" && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
            base="$BEFORE_SHA"
          else
            git show --check --format= HEAD
            exit 0
          fi
          git diff --check "$base...HEAD"

  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install public source tree
        run: python -m pip install ".[dev,console]"
      - name: Check public entry points
        run: |
          python -m tracecast --version
          python -m tracecast --help
      - name: Run platform smoke tests
        run: python -m pytest -q tests/test_imports.py tests/test_prompts.py tests/test_console_onboarding.py
