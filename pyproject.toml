[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tracecast"
version = "0.1.0"
description = "Evidence-grounded long-form podcast script generation toolkit."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8.2",
  "ruff>=0.6",
]
console = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[project.scripts]
tracecast = "tracecast.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tracecast"]

[tool.hatch.build.targets.wheel.force-include]
"prompt" = "tracecast/prompt"

[tool.hatch.build.targets.sdist]
only-include = [
  ".env.example",
  "LICENSE",
  "README.md",
  "configs/runtime.example.json",
  "configs/source_profile_templates.example.json",
  "docs/user",
  "hosts/example_host_zh.json",
  "projects/example",
  "prompt",
  "pyproject.toml",
  "src",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
